; (0% condition on the sell HUD, $0 payout). Above this value,
; condition scales linearly up to 100% at full health. Lower this
; value to be more forgiving of damage; raise it to be stricter.
; Example: 25 means a car at 62.5% health shows 50% condition.
; Example: 50 means a car at 50% health shows 0% condition.
; Example: 50 means a car at 75% health shows 50% condition.
SELL_CONDITION_FLOOR = 50

